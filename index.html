<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 40px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      color: #cbd5e1;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      background: #2563eb;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    footer {
      margin-top: 50px;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.8rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">🚀 COMING SOON</div>

    <h1>We're Launching Soon!</h1>

    <p>
      Our website is currently under development.
      We're working hard to bring you an amazing experience.
      Stay tuned!
    </p>

    <footer>
      &copy; 2026 Your Company. All Rights Reserved.
    </footer>
  </div>

</body>
</html>
